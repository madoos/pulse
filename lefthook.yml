# Git hooks (https://lefthook.dev), installed by `pnpm install`.
# They run locally the same checks as CI, so problems are caught before pushing.

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: format
      run: pnpm exec prettier --check --ignore-unknown {staged_files}

    - name: lint
      glob: '*.{js,mjs,ts,tsx}'
      run: pnpm exec eslint --no-warn-ignored {staged_files}

    - name: typecheck
      glob: '*.{ts,tsx}'
      run: pnpm typecheck

    - name: related tests
      glob: '*.{ts,tsx}'
      run: pnpm exec vitest related --run --passWithNoTests {staged_files}

pre-push:
  jobs:
    - name: tests with coverage
      run: pnpm test:coverage
