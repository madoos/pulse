# SonarQube Cloud analysis, run from CI (see ADR-0006 and .github/workflows/ci.yml).
sonar.organization=madoos
sonar.projectKey=madoos_pulse

# The whole repository is analysed: application code, Dockerfiles, CI and deployment manifests.
# Files ignored by git (node_modules, builds, coverage, seed data) are skipped automatically.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/migrations/meta/**

# Coverage from Vitest (pnpm test:coverage). Excluded: code with no logic to test
# (entry points, configuration, stories, test helpers, migrations, deployment).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.stories.tsx,**/.storybook/**,**/main.ts,**/main.tsx,**/server.ts,**/*.config.ts,**/*.config.js,**/shared/testing/**,**/database/testing.ts,**/migrations/**,deploy/**

# Generated SQL migrations are not hand-written code, so their duplication does not count.
sonar.cpd.exclusions=**/migrations/**

# The CI job fails when the quality gate fails.
sonar.qualitygate.wait=true
