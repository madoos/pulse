services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
    ports:
      - '${API_PORT:-3000}:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://localhost:${API_PORT:-3000}/api/v1
    ports:
      - '${WEB_PORT:-8080}:8080'

  storybook:
    build:
      context: .
      dockerfile: packages/design-system/Dockerfile
    ports:
      - '${STORYBOOK_PORT:-6006}:8080'
