services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U pulse -d pulse']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'migrate.js']
    environment:
      DATABASE_URL: postgres://pulse:pulse@db:5432/pulse
      SEED_USER_EMAIL: admin@pulse.com
      SEED_USER_PASSWORD: pulse-demo-password
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://pulse:pulse@db:5432/pulse
      JWT_SECRET: local-development-secret-not-for-production
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://localhost:${API_PORT:-3000}/api/v1
    ports:
      - '${WEB_PORT:-8080}:8080'

  storybook:
    build:
      context: .
      dockerfile: packages/design-system/Dockerfile
    ports:
      - '${STORYBOOK_PORT:-6006}:8080'

  pgweb:
    image: sosedoff/pgweb:0.16.2
    command: ['pgweb', '--bind=0.0.0.0', '--listen=8081', '--readonly', '--lock-session']
    environment:
      PGWEB_DATABASE_URL: postgres://pulse:pulse@db:5432/pulse?sslmode=disable
      PGWEB_AUTH_USER: admin@pulse.com
      PGWEB_AUTH_PASS: pulse-demo-password
    ports:
      - '${PGWEB_PORT:-8081}:8081'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
