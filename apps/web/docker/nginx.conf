server {
  listen 8080;
  root /usr/share/nginx/html;

  # Generated at startup by 40-runtime-config.sh.
  location = /config.js {
    alias /tmp/config.js;
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
