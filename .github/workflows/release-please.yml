name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create release PR / release
    runs-on: ubuntu-latest
    outputs:
      api-released: ${{ steps.release.outputs['apps/api--release_created'] }}
      api-version: ${{ steps.release.outputs['apps/api--version'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  api-image:
    name: Publish API image
    needs: release-please
    if: needs.release-please.outputs.api-released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}-api
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.release-please.outputs.api-version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    name: Deploy to k3s
    needs: [release-please, api-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency: deploy
    steps:
      - uses: actions/checkout@v7
      - name: Pin the released image
        working-directory: deploy/k8s
        run: kustomize edit set image api=ghcr.io/${{ github.repository }}-api:${{ needs.release-please.outputs.api-version }}
      - name: Apply the manifests on the VPS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          kubectl kustomize deploy/k8s | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_HOST"
