name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create release PR / release
    runs-on: ubuntu-latest
    outputs:
      api-released: ${{ steps.release.outputs['apps/api--release_created'] }}
      api-version: ${{ steps.release.outputs['apps/api--version'] }}
      web-released: ${{ steps.release.outputs['apps/web--release_created'] }}
      web-version: ${{ steps.release.outputs['apps/web--version'] }}
      design-system-released: ${{ steps.release.outputs['packages/design-system--release_created'] }}
      design-system-version: ${{ steps.release.outputs['packages/design-system--version'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  api-image:
    name: Publish API image
    needs: release-please
    if: needs.release-please.outputs.api-released == 'true'
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: api
      dockerfile: apps/api/Dockerfile
      version: ${{ needs.release-please.outputs.api-version }}

  web-image:
    name: Publish web image
    needs: release-please
    if: needs.release-please.outputs.web-released == 'true'
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: web
      dockerfile: apps/web/Dockerfile
      version: ${{ needs.release-please.outputs.web-version }}

  storybook-image:
    name: Publish Storybook image
    needs: release-please
    if: needs.release-please.outputs.design-system-released == 'true'
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: storybook
      dockerfile: packages/design-system/Dockerfile
      version: ${{ needs.release-please.outputs.design-system-version }}

  deploy:
    name: Deploy to k3s
    needs: [release-please, api-image, web-image, storybook-image]
    if: >-
      !failure() && !cancelled() &&
      (needs.release-please.outputs.api-released == 'true' ||
       needs.release-please.outputs.web-released == 'true' ||
       needs.release-please.outputs.design-system-released == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency: deploy
    steps:
      - uses: actions/checkout@v7
      - name: Pin the released images
        working-directory: deploy/k8s
        run: |
          api=$(jq -r '."apps/api"' ../../.release-please-manifest.json)
          web=$(jq -r '."apps/web"' ../../.release-please-manifest.json)
          storybook=$(jq -r '."packages/design-system"' ../../.release-please-manifest.json)
          kustomize edit set image "api=ghcr.io/${{ github.repository }}-api:$api"
          kustomize edit set image "web=ghcr.io/${{ github.repository }}-web:$web"
          kustomize edit set image "storybook=ghcr.io/${{ github.repository }}-storybook:$storybook"
      - name: Apply the manifests on the VPS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          kubectl kustomize deploy/k8s | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_HOST"
