name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, typecheck, test and analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarQube Cloud needs the full history to tell new code from old.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dependencies:
    name: Scan dependencies
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on high or critical vulnerabilities that can be fixed by upgrading.
      - run: npx --yes snyk@1.1309.0 test --all-projects --org=madoos --severity-threshold=high --fail-on=upgradable
      # On main, records the dependencies in Snyk, which alerts on vulnerabilities found later.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx --yes snyk@1.1309.0 monitor --all-projects --org=madoos

  images:
    name: Build and scan ${{ matrix.image.name }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { name: api, dockerfile: apps/api/Dockerfile }
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: storybook, dockerfile: packages/design-system/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: false
          load: true
          tags: pulse-${{ matrix.image.name }}:ci
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
      # Fails on high or critical vulnerabilities in the operating system or the bundled packages.
      - run: >-
          npx --yes snyk@1.1309.0 container test pulse-${{ matrix.image.name }}:ci
          --file=${{ matrix.image.dockerfile }} --org=madoos --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          npx --yes snyk@1.1309.0 container monitor pulse-${{ matrix.image.name }}:ci
          --file=${{ matrix.image.dockerfile }} --org=madoos --project-name=pulse-${{ matrix.image.name }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
